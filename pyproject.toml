[project]
name = "mortgage-intelligence-copilot"
version = "0.1.0"
description = "Production-style mortgage research copilot with RAG, citations, and agent workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "ruff>=0.3",
]
openai = [
  "openai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
